[project]
name = "xjfx"
dynamic = ["version"]
authors = [
  { name="Justin Findlay", email="justin@findlay.space" },
]
description = "Collection of simple utility functions and classes that extend standard library functionality."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "colorama",
]

[project.urls]
"Homepage" = "https://github.com/jfindlay/xjfx/"
"Bug Tracker" = "https://github.com/jfindlay/xjfx/issues/"

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "types-colorama",
    "pylint",
    "ruff",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/xjfx"]

[tool.hatch.build.targets.sdist]
include = ["src/xjfx"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "PL"]
ignore = [
    "PLR0913",  # too-many-arguments (matches pylint disable)
    "PLR0917",  # too-many-positional-arguments (matches pylint disable)
]

[tool.pylint.FORMAT]
max-line-length = 128

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "logging-fstring-interpolation",
    "redefined-builtin",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
]
